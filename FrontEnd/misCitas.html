    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />

    <link

  <body>
    <!-- ========== HEADER ========== -->

        <div
          class="align-self-center collapse navbar-collapse flex-fill d-lg-flex justify-content-lg-between"
          id="templatemo_main_nav"
        >
          <div class="flex-fill">
            <ul
              class="nav navbar-nav d-flex justify-content-between mx-lg-auto"
            >
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="servicios.html">Servicios</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="productos.html">Productos</a>
              </li>

              <li id="nav-admin" class="nav-item" style="display: none">
                <a class="nav-link" href="adminView.html">Admin</a>
              </li>

              <li id="nav-mis-citas" class="nav-item" style="display: none">
                <a class="nav-link" href="misCitas.html">Mis Citas</a>
              </li>
            </ul>
          </div>

          <!-- ICONOS DERECHA -->
          <div class="navbar align-self-center d-flex">
            <!-- CARRITO -->
            <a
              class="nav-icon position-relative text-decoration-none"
              href="carrito.html"
            >
              <i class="fa fa-fw fa-cart-arrow-down text-dark mr-1"></i>
              <span
                id="cart-count"
                class="position-absolute top-0 left-100 translate-middle badge rounded-pill bg-success text-white"
                style="display: none"
              ></span>
            </a>

            <!-- LOGIN -->
            <a
              id="nav-login"
              class="nav-icon position-relative text-decoration-none"
              href="login.html"
            >
              <i class="fa fa-fw fa-user text-dark mr-3"></i>
            </a>

            <!-- NOMBRE DEL CLIENTE -->
            <span
              id="nav-user-name"
              class="text-dark mx-3"
              style="display: none; font-weight: bold"
            ></span>

            <!-- LOGOUT -->
            <a
              id="nav-logout"
              class="nav-link text-danger"
              href="#"
              style="display: none"
            >
              Cerrar sesión
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- ===================== CONTENIDO ===================== -->

      <div class="table-responsive">

          <thead class="table-success">
            <tr>
              <th>ID</th>
              <th>Servicio</th>
              <th>Fecha</th>
              <th>Notas</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-citas"></tbody>
        </table>
      </div>

    <!-- ===================== FOOTER ===================== -->
    <footer class="bg-dark mt-auto" id="tempaltemo_footer">
      <div class="container">
        <div class="row">
          <div class="col-md-4 pt-5">
            <h2 class="h2 text-success border-bottom pb-3 border-light logo">
              Estética Angelus
            </h2>
            <ul class="list-unstyled text-light footer-link-list">
              <li>
                <i class="fas fa-map-marker-alt fa-fw"></i> San Jose, Costa Rica
              </li>
              <li><i class="fa fa-phone fa-fw"></i> 506 0000-0000</li>
              <li>
                <i class="fa fa-envelope fa-fw"></i> esteticangelus@gmail.com
              </li>
            </ul>
          </div>

          <div class="w-100 bg-black py-3">
            <div class="container">
              <p class="text-left text-light">
                Copyright © Estética Angelus |
                <a href="https://templatemo.com" target="_blank">TemplateMo</a>

            </div>
          </div>
        </div>

    <!-- ===================== SCRIPTS ===================== -->
    <script src="assets/js/jquery-1.11.0.min.js"></script>
    <script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/misCitas.js"></script>

    <!-- Contador carrito -->
    <script>
      function actualizarContadorCarrito() {
        let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
        let total = carrito.reduce((sum, item) => sum + item.cantidad, 0);

        if (total > 0) {
          $("#cart-count").text(total).show();
        } else {
          $("#cart-count").hide();
        }
      }
      $(document).ready(actualizarContadorCarrito);
    </script>

    <!-- Login dinámico -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const usuario = JSON.parse(localStorage.getItem("usuario"));

        const loginBtn = document.getElementById("nav-login");
        const logoutBtn = document.getElementById("nav-logout");
        const userName = document.getElementById("nav-user-name");
        const misCitas = document.getElementById("nav-mis-citas");
        const adminBtn = document.getElementById("nav-admin");

        if (usuario) {
          loginBtn.style.display = "none";
          userName.style.display = "block";
          userName.innerText = "Hola, " + usuario.nombre;
          logoutBtn.style.display = "block";

          if (usuario.rol_id == 7) misCitas.style.display = "block";
          if (usuario.rol_id == 1) adminBtn.style.display = "block";
        } else {
          loginBtn.style.display = "block";
          logoutBtn.style.display = "none";
          userName.style.display = "none";
          misCitas.style.display = "none";
          adminBtn.style.display = "none";
        }

        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("usuario");
          alert("Sesión cerrada");
          window.location.href = "login.html";
        });
      });
    </script>
  </body>
</html>
