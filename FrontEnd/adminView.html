<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Administrador - CRUD</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Optional: íconos (bootstrap icons) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- jQuery (necesario para app.js) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- app.js - cargado al final del body -->
    <style>
      body {
        background: #f7f7f9;
      }
      .table-wrap {
        max-height: 55vh;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <h2 class="mb-3 text-center">Panel de Administración</h2>

      <!-- Alertas globales -->
      <div id="alertPlaceholder"></div>

      <!-- Nav tabs -->
      <ul class="nav nav-tabs" id="adminTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="clientes-tab"
            data-bs-toggle="tab"
            data-bs-target="#clientes"
            type="button"
            role="tab"
          >
            Clientes
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="servicios-tab"
            data-bs-toggle="tab"
            data-bs-target="#servicios"
            type="button"
            role="tab"
          >
            Servicios
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="productos-tab"
            data-bs-toggle="tab"
            data-bs-target="#productos"
            type="button"
            role="tab"
          >
            Productos
          </button>
        </li>
      </ul>

      <div class="tab-content mt-4">
        <!-- CLIENTES TAB -->
        <div class="tab-pane fade show active" id="clientes" role="tabpanel">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5>Clientes</h5>
            <div>
              <button id="btnAgregarCliente" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> Agregar
              </button>
            </div>
          </div>

          <div class="table-wrap border rounded bg-white p-2">
            <table class="table table-hover mb-0" id="tablaClientes">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Usuario</th>
                  <th>Estado</th>
                  <th>Preferencias</th>
                  <th>Historial Tratamientos</th>
                  <th style="width: 140px">Acciones</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- SERVICIOS TAB -->
        <div class="tab-pane fade" id="servicios" role="tabpanel">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5>Servicios</h5>
            <div>
              <button id="btnAgregarServicio" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> Agregar
              </button>
            </div>
          </div>

          <div class="table-wrap border rounded bg-white p-2">
            <table class="table table-hover mb-0" id="tablaServicios">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Estado</th>
                  <th>Categoría</th>
                  <th>Nombre</th>
                  <th>Descripción</th>
                  <th>Duración</th>
                  <th>Precio</th>
                  <th style="width: 140px">Acciones</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- PRODUCTOS TAB -->
        <div class="tab-pane fade" id="productos" role="tabpanel">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5>Productos</h5>
            <div>
              <button id="btnAgregarProducto" class="btn btn-primary btn-sm">
                <i class="bi bi-plus-lg"></i> Agregar
              </button>
            </div>
          </div>

          <div class="table-wrap border rounded bg-white p-2">
            <table class="table table-hover mb-0" id="tablaProductos">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Categoría</th>
                  <th>Estado</th>
                  <th>Proveedor</th>
                  <th>Nombre</th>
                  <th>Descripción</th>
                  <th>Precio</th>
                  <th style="width: 140px">Acciones</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ---------------------------
     MODALES CLIENTES
   --------------------------- -->

    <!-- Modal Crear / Editar Cliente -->
    <div class="modal fade" id="modalCliente" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <form id="formCliente" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalClienteTitle">Nuevo Cliente</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <input hidden id="isCreate" class="form-control" />
            <div class="mb-3">
              <label class="form-label">Cliente ID</label>
              <input
                type="number"
                id="cliente_id"
                name="cliente_id"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Usuario ID</label>
              <input
                type="number"
                id="usuario_id"
                name="usuario_id"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Estado</label>
              <select
                id="estado_id"
                name="estado_id"
                class="form-select"
                required
              >
                <option value="1">1 - Habilitado</option>
                <option value="2">2 - Eliminado</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Preferencias</label>
              <textarea
                id="preferencias"
                name="preferencias"
                class="form-control"
                rows="2"
              ></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Historial Tratamientos</label>
              <textarea
                id="historial_tratamientos"
                name="historial_tratamientos"
                class="form-control"
                rows="2"
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
            <button type="submit" class="btn btn-primary" id="saveClienteBtn">
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ---------------------------
     MODALES SERVICIOS
   --------------------------- -->

    <!-- Modal Crear / Editar Servicio -->
    <div class="modal fade" id="modalServicio" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <form id="formServicio" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalServicioTitle">Nuevo Servicio</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="servicio_id" name="servicio_id" />
            <div class="mb-3">
              <label class="form-label">Estado</label>
              <select
                id="serv_estado_id"
                name="estado_id"
                class="form-select"
                required
              >
                <option value="1">1 - Habilitado</option>
                <option value="2">2 - Eliminado</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Categoría ID</label>
              <input
                type="number"
                id="categoria_id_serv"
                name="categoria_id"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input
                type="text"
                id="serv_nombre"
                name="nombre"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea
                id="serv_descripcion"
                name="descripcion"
                class="form-control"
                rows="2"
              ></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Duración (min)</label>
              <input
                type="number"
                id="duracion"
                name="duracion"
                class="form-control"
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Precio (centavos/moneda)</label>
              <input
                type="number"
                id="serv_precio"
                name="precio"
                class="form-control"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
            <button type="submit" class="btn btn-primary" id="saveServicioBtn">
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ---------------------------
     MODALES PRODUCTOS
   --------------------------- -->

    <!-- Modal Crear / Editar Producto -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <form id="formProducto" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalProductoTitle">Nuevo Producto</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <input hidden id="isCreate" class="form-control" />
            <div class="mb-3">
              <label class="form-label">Producto ID</label>
              <input
                type="number"
                id="producto_id"
                name="producto_id"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Categoría ID</label>
              <input
                type="number"
                id="categoria_id_prod"
                name="categoria_id"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Estado</label>
              <select
                id="prod_estado_id"
                name="estado_id"
                class="form-select"
                required
              >
                <option value="1">1 - Habilitado</option>
                <option value="2">2 - Eliminado</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Proveedor (manual)</label>
              <input
                type="text"
                id="proveedor_id"
                name="proveedor_id"
                class="form-control"
                placeholder="ID o nombre (temporal)"
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input
                type="text"
                id="prod_nombre"
                name="nombre"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea
                id="prod_descripcion"
                name="descripcion"
                class="form-control"
                rows="2"
              ></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Precio</label>
              <input
                type="number"
                id="prod_precio"
                name="precio"
                class="form-control"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
            <button type="submit" class="btn btn-primary" id="saveProductoBtn">
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Bootstrap Bundle JS (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- app.js: contiene todo el CRUD con jQuery -->
    <script src="./assets/js/adminApp.js"></script>
  </body>
</html>
