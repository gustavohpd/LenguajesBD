<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagar | Estética Angelus</title>

    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/templatemo.css" />
    <link rel="stylesheet" href="assets/css/custom.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!-- ====================== HEADER GLOBAL ====================== -->
    <nav class="navbar navbar-expand-lg navbar-light shadow">
      <div class="container d-flex justify-content-between align-items-center">
        <a
          class="navbar-brand text-success logo h1 align-self-center"
          href="index.html"
        >
          Angelus
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#templatemo_main_nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="align-self-center collapse navbar-collapse flex-fill d-lg-flex justify-content-lg-between"
          id="templatemo_main_nav"
        >
          <ul class="nav navbar-nav d-flex justify-content-between mx-lg-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="servicios.html">Servicios</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="productos.html">Productos</a>
            </li>
            <li id="nav-mis-citas" class="nav-item" style="display: none">
              <a class="nav-link" href="misCitas.html">Mis Citas</a>
            </li>
            <li id="nav-admin" class="nav-item" style="display: none">
              <a class="nav-link" href="adminView.html">Admin</a>
            </li>
          </ul>

          <div class="navbar align-self-center d-flex">
            <!-- Carrito -->
            <a
              class="nav-icon position-relative text-decoration-none"
              href="carrito.html"
            >
              <i class="fa fa-fw fa-cart-arrow-down text-dark mr-1"></i>
              <span
                id="cart-count"
                class="position-absolute top-0 left-100 translate-middle badge rounded-pill bg-success text-white"
                style="display: none"
              ></span>
            </a>

            <!-- Login -->
            <a
              id="nav-login"
              class="nav-icon position-relative text-decoration-none"
              href="login.html"
            >
              <i class="fa fa-fw fa-user text-dark mr-3"></i>
            </a>

            <!-- Nombre usuario -->
            <span
              id="nav-user-name"
              class="text-dark mx-3"
              style="display: none; font-weight: bold"
            ></span>

            <!-- Logout -->
            <a
              id="nav-logout"
              class="nav-link text-danger"
              style="display: none"
              href="#"
              >Cerrar sesión</a
            >
          </div>
        </div>
      </div>
    </nav>
    <!-- ====================== FIN HEADER ====================== -->

    <!-- ====================== CONTENIDO PRINCIPAL ====================== -->
    <div class="container py-5 flex-grow-1">
      <h2 class="mb-4 text-center">Pago con Tarjeta</h2>

      <div class="card shadow p-4" style="max-width: 500px; margin: 0 auto">
        <form id="form-pago">
          <label>Nombre en la tarjeta</label>
          <input id="nombre-tarjeta" class="form-control mb-3" required />

          <label>Número de tarjeta</label>
          <input
            id="num-tarjeta"
            class="form-control mb-3"
            maxlength="16"
            required
          />

          <label>Fecha de expiración</label>
          <input id="exp" type="month" class="form-control mb-3" required />

          <label>CVV</label>
          <input id="cvv" class="form-control mb-3" maxlength="3" required />

          <button class="btn btn-success w-100 mt-3">Pagar</button>
        </form>
      </div>
    </div>

    <!-- ====================== FOOTER ====================== -->
    <footer class="bg-dark mt-auto" id="tempaltemo_footer">
      <div class="container">
        <div class="row">
          <div class="col-md-4 pt-5">
            <h2 class="h2 text-success border-bottom pb-3 border-light logo">
              Estética Angelus
            </h2>
            <ul class="list-unstyled text-light footer-link-list">
              <li>
                <i class="fas fa-map-marker-alt fa-fw"></i> San José, Costa Rica
              </li>
              <li><i class="fa fa-phone fa-fw"></i> 506 0000-0000</li>
              <li>
                <i class="fa fa-envelope fa-fw"></i> esteticangelus@gmail.com
              </li>
            </ul>
          </div>

          <div class="w-100 bg-black py-3 mt-4">
            <div class="container">
              <p class="text-center text-light mb-0">© Estética Angelus</p>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="assets/js/jquery-1.11.0.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/js/pago.js"></script>
  </body>
</html>
