<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Estetica Angelus</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/templatemo.css" />
    <link rel="stylesheet" href="assets/css/custom.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap"
    />
    <link rel="stylesheet" href="assets/css/fontawesome.min.css" />
  </head>

  <body>
    <!-- ====================== HEADER GLOBAL ====================== -->
    <nav class="navbar navbar-expand-lg navbar-light shadow">
      <div class="container d-flex justify-content-between align-items-center">
        <a
          class="navbar-brand text-success logo h1 align-self-center"
          href="index.html"
        >
          Angelus
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#templatemo_main_nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="align-self-center collapse navbar-collapse flex-fill d-lg-flex justify-content-lg-between"
          id="templatemo_main_nav"
        >
          <!-- MENÚ -->
          <ul class="nav navbar-nav d-flex justify-content-between mx-lg-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="servicios.html">Servicios</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="productos.html">Productos</a>
            </li>

            <li id="nav-mis-citas" class="nav-item" style="display: none">
              <a class="nav-link" href="misCitas.html">Mis Citas</a>
            </li>

            <li id="nav-admin" class="nav-item" style="display: none">
              <a class="nav-link" href="adminView.html">Admin</a>
            </li>
          </ul>

          <!-- DERECHA -->
          <div class="navbar align-self-center d-flex">
            <!-- Buscar -->
            <a
              class="nav-icon d-none d-lg-inline"
              href="#"
              data-bs-toggle="modal"
              data-bs-target="#templatemo_search"
            >
              <i class="fa fa-fw fa-search text-dark mr-2"></i>
            </a>

            <!-- Carrito -->
            <a
              class="nav-icon position-relative text-decoration-none"
              href="carrito.html"
            >
              <i class="fa fa-fw fa-cart-arrow-down text-dark mr-1"></i>
              <span
                id="cart-count"
                class="position-absolute top-0 left-100 translate-middle badge rounded-pill bg-success text-white"
                style="display: none"
              ></span>
            </a>

            <!-- Login -->
            <a
              id="nav-login"
              class="nav-icon position-relative text-decoration-none"
              href="login.html"
            >
              <i class="fa fa-fw fa-user text-dark mr-3"></i>
            </a>

            <!-- Usuario -->
            <span
              id="nav-user-name"
              class="text-dark mx-3"
              style="display: none; font-weight: bold"
            ></span>

            <!-- Logout -->
            <a
              id="nav-logout"
              class="nav-link text-danger"
              href="#"
              style="display: none"
            >
              Cerrar sesión
            </a>
          </div>
        </div>
      </div>
    </nav>
    <!-- ====================== FIN HEADER ====================== -->

    <!-- MODAL BUSCAR -->
    <div class="modal fade bg-white" id="templatemo_search" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="w-100 pt-1 mb-5 text-right">
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>
        </div>
        <form class="modal-content modal-body border-0 p-0">
          <div class="input-group mb-2">
            <input type="text" class="form-control" placeholder="Buscar..." />
            <button class="input-group-text bg-success text-light">
              <i class="fa fa-fw fa-search"></i>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===========================
        PRODUCTO INDIVIDUAL
    ============================ -->
    <div class="container py-5">
      <div class="row" id="producto-detalle">
        <!-- IMAGEN -->
        <div class="col-md-6 text-center">
          <img
            id="prod-img"
            src="assets/img/default.png"
            class="img-fluid rounded"
            alt="Producto"
          />
        </div>

        <!-- DETALLES -->
        <div class="col-md-6">
          <h1 id="prod-nombre" class="h2"></h1>
          <h3 id="prod-precio" class="text-success mt-3"></h3>
          <p id="prod-desc" class="mt-4"></p>

          <label class="mt-3 d-block">Cantidad:</label>
          <input
            id="prod-cantidad"
            type="number"
            min="1"
            value="1"
            class="form-control w-25"
          />

          <button id="btn-comprar" class="btn btn-success mt-3">Comprar</button>
        </div>
      </div>
    </div>

    <!-- ===========================
        FOOTER
    ============================ -->
    <footer class="bg-dark" id="tempaltemo_footer">
      <div class="container">
        <div class="row">
          <div class="col-md-4 pt-5">
            <h2 class="h2 text-success border-bottom pb-3 border-light logo">
              Estética Angelus
            </h2>
            <ul class="list-unstyled text-light footer-link-list">
              <li>
                <i class="fas fa-map-marker-alt fa-fw"></i> San José, Costa Rica
              </li>
              <li><i class="fa fa-phone fa-fw"></i> 506 0000-0000</li>
              <li>
                <i class="fa fa-envelope fa-fw"></i> esteticangelus@gmail.com
              </li>
            </ul>
          </div>

          <div class="w-100 bg-black py-3">
            <div class="container">
              <p class="text-left text-light">
                © Estética Angelus | Designed by
                <a href="https://templatemo.com" target="_blank">TemplateMo</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <!-- ===========================
        SCRIPTS
    ============================ -->
    <script src="assets/js/jquery-1.11.0.min.js"></script>
    <script src="assets/js/jquery-migrate-1.2.1.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/carrito.js"></script>
    <script src="assets/js/productoIndividual.js"></script>

    <!-- HEADER DINÁMICO -->
    <script src="assets/js/header.js"></script>
  </body>
</html>
