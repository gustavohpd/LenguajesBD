  <body>

    <nav class="navbar navbar-expand-lg navbar-light shadow">
      <div class="container d-flex justify-content-between align-items-center">
        <a
          class="navbar-brand text-success logo h1 align-self-center"
          href="index.html"

        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#templatemo_main_nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse flex-fill justify-content-lg-between"
          id="templatemo_main_nav"
        >
          <ul class="nav navbar-nav mx-lg-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="servicios.html">Servicios</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="productos.html">Productos</a>
            </li>
          </ul>

          <div class="navbar align-self-center d-flex">
            <!-- ICONO CARRITO -->
            <a
              class="nav-icon position-relative text-decoration-none"
              href="carrito.html"
            >
              <i class="fa fa-fw fa-cart-arrow-down text-dark mr-1"></i>
              <span
                id="cart-count"
                class="position-absolute top-0 left-100 translate-middle badge rounded-pill bg-success text-white"
                style="display: none"
              ></span>
            </a>

            <!-- USUARIO -->
            <a
              class="nav-icon position-relative text-decoration-none"
              href="login.html"

      <div class="row" id="servicio-detalle">

        <div class="col-md-6 text-center">
          <img
            id="serv-img"
            src="assets/img/default-servicio.png"
            class="img-fluid rounded"
            alt="Servicio"
            style="max-height: 350px; object-fit: cover"
          />
        </div>

        <!-- INFORMACIÓN -->
        <div class="col-md-6">
          <h1 id="serv-nombre" class="h2"></h1>
          <h3 id="serv-precio" class="text-success mt-3"></h3>

          <p id="serv-desc" class="mt-4"></p>

          <p class="mt-3">
            <strong>Duración: </strong>
            <span id="serv-duracion"></span> minutos
          </p>

          <a href="citas.html" class="btn btn-success mt-4"> Agendar cita </a>

      </div>
