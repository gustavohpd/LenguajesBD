<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Admin - Citas | Estética Angelus</title>

    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/templatemo.css" />
    <link rel="stylesheet" href="assets/css/custom.css" />

    <style>
      body {
        background: #f4f5f7;
      }

      .admin-sidebar {
        width: 250px;
        min-height: 100vh;
        background: #0f5132;
        color: white;
        padding: 20px 15px;
        position: fixed;
        top: 0;
        left: 0;
      }

      .admin-sidebar a {
        display: block;
        padding: 10px;
        margin-bottom: 6px;
        color: #ffffffd8;
        text-decoration: none;
        border-radius: 6px;
      }

      .admin-sidebar a:hover,
      .active {
        background: rgba(255, 255, 255, 0.23);
        color: white;
      }

      .admin-content {
        margin-left: 270px;
        padding: 40px;
      }

      .table-container {
        max-height: 60vh;
        overflow-y: auto;
      }
    </style>
  </head>

  <body>
    <!-- SIDEBAR -->
    <div class="admin-sidebar">
      <h3 class="text-center fw-bold mb-3">Angelus Admin</h3>
      <a href="dashboardAdmin.html">📊 Dashboard</a>
      <a href="clientesAdmin.html">👥 Clientes</a>
      <a href="serviciosAdmin.html">💆 Servicios</a>
      <a href="productosAdmin.html">🛍 Productos</a>
      <a href="citasAdmin.html" class="active">📅 Citas</a>
      <a href="index.html">← Volver al sitio</a>
    </div>

    <!-- CONTENT -->
    <div class="admin-content">
      <h2 class="mb-1">Gestión de Citas</h2>
      <p class="text-muted">Administra todas las citas registradas.</p>

      <!-- Filtros -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <input
          id="search-citas"
          type="search"
          class="form-control"
          placeholder="Buscar por ID, cliente, servicio..."
          style="max-width: 350px"
        />

        <button id="btn-refresh-citas" class="btn btn-outline-success">
          Recargar
        </button>
      </div>

      <div id="status-citas" class="text-muted mb-2">
        Estado: esperando acción...
      </div>

      <!-- Tabla -->
      <div class="table-container bg-white rounded shadow-sm p-2 border">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Servicio</th>
              <th>Estado</th>
              <th>Fecha / Hora</th>
              <th>Notas</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="citas-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- MODAL (SOLO PARA EDITAR) -->
    <div class="modal fade" id="citaModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <form id="citaForm">
            <div class="modal-header">
              <h5 class="modal-title" id="citaModalTitle">Editar Cita</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>

            <div class="modal-body">
              <div id="cita-form-error" class="alert alert-danger d-none"></div>

              <div class="row g-3">
                <div class="col-md-3">
                  <label class="form-label">cita_id</label>
                  <input
                    id="cita_id"
                    type="number"
                    class="form-control"
                    readonly
                  />
                </div>

                <div class="col-md-3">
                  <label class="form-label">cliente_id</label>
                  <input id="cliente_id" type="number" class="form-control" />
                </div>

                <div class="col-md-3">
                  <label class="form-label">servicio_id</label>
                  <input id="servicio_id" type="number" class="form-control" />
                </div>

                <div class="col-md-3">
                  <label class="form-label">estado_id</label>
                  <select id="estado_id" class="form-select">
                    <option value="1">Activa</option>
                    <option value="2">Cancelada</option>
                    <option value="3">Finalizada</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Fecha y hora</label>
                  <input
                    id="fecha_hora"
                    type="datetime-local"
                    class="form-control"
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Notas</label>
                  <textarea id="notas" class="form-control"></textarea>
                </div>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cerrar
              </button>
              <button type="submit" class="btn btn-success">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="assets/js/jquery-1.11.0.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/citasAdmin.js"></script>
  </body>
</html>
