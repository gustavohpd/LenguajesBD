    />
    <link rel="stylesheet" href="assets/css/fontawesome.min.css" />
  </head>

  <body>
    <!-- ================= HEADER ================= -->
    <nav class="navbar navbar-expand-lg navbar-light shadow">
      <div class="container d-flex justify-content-between align-items-center">
        <a
          class="navbar-brand text-success logo h1 align-self-center"
          href="index.html"
        >
          Angelus
        </a>

        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#templatemo_main_nav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="align-self-center collapse navbar-collapse flex-fill d-lg-flex justify-content-lg-between"
          id="templatemo_main_nav"
        >
          <div class="flex-fill">
            <ul
              class="nav navbar-nav d-flex justify-content-between mx-lg-auto"
            >
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">

            </a>
          </div>
        </div>
      </div>
    </nav>
    <!-- ================= END HEADER ================= -->

    <!-- ================= REGISTRO ================= -->
    <div class="register-page">
      <div class="register-box">
        <h2>Crear Cuenta</h2>

        <!-- Mensaje de Error -->
        <div id="registro-error" class="alert alert-danger d-none"></div>

        <form id="form-registro">
          <input id="reg-nombre" type="text" placeholder="Nombre" required />
          <input
            id="reg-apellido1"
            type="text"
            placeholder="Apellido Paterno"
            required
          />
          <input
            id="reg-apellido2"
            type="text"
            placeholder="Apellido Materno"
          />

          <input
            id="reg-correo"
            type="email"
            placeholder="Correo electrónico"
            required
          />
          <input id="reg-telefono" type="tel" placeholder="Teléfono" required />

          <input
            id="reg-password"
            type="password"
            placeholder="Contraseña"
            required
          />

          <button type="submit">Registrarse</button>
        </form>

        <p class="link">
          ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
        </p>
      </div>
    </div>
    <!-- ================= END REGISTRO ================= -->

    <!-- ================= FOOTER ================= -->
    <footer class="bg-dark" id="tempaltemo_footer">
      <div class="container">
        <div class="row">

              Estética Angelus
            </h2>
            <ul class="list-unstyled text-light footer-link-list">

                Rica

              <li>
                <i class="fa fa-envelope fa-fw"></i> esteticangelus@gmail.com
              </li>
            </ul>
          </div>

          <div class="w-100 bg-black py-3">
            <div class="container">
              <p class="text-left text-light">
                Copyright © Estética Angelus | Designed by
                <a href="https://templatemo.com" target="_blank">TemplateMo</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </footer>
    <!-- ================= END FOOTER ================= -->

    <script src="assets/js/jquery-1.11.0.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>

    <!-- Script que maneja el registro -->
    <script src="assets/js/registro.js"></script>
